[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "platform-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3", "sqlalchemy[asyncio]>=2.0,<3",
  "alembic>=1.14,<2", "asyncpg>=0.30,<1", "pgvector>=0.3,<1",
  "redis>=5,<6", "httpx>=0.28,<1", "arq>=0.26,<0.27",
  "argon2-cffi>=23.1,<26", "cryptography>=44,<50", "langgraph>=0.4,<2",
  "python-multipart>=0.0.20,<1", "email-validator>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated (reviewed) migrations contain long constraint expressions.
"migrations/versions/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: requires PostgreSQL and Redis"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["arq.*"]
ignore_missing_imports = true
