<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#5a47f5" />
    <title>You're offline · pi</title>
    <style>
      :root {
        --bg: #f6f6fb;
        --fg: #1b1840;
        --muted: #5d5a7a;
        --accent: #5a47f5;
        --surface: #ffffff;
        --border: #e3e1f2;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #15132b;
          --fg: #f1efff;
          --muted: #b3afd6;
          --accent: #8e80ff;
          --surface: #1e1b3a;
          --border: #34305a;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main {
        width: 100%;
        max-width: 380px;
        padding: 32px 24px;
        border: 1px solid var(--border);
        border-radius: 24px;
        background: var(--surface);
        text-align: center;
      }
      img { width: 88px; height: 88px; }
      h1 { margin: 16px 0 8px; font-size: 22px; letter-spacing: -0.02em; }
      p { margin: 0; color: var(--muted); line-height: 1.55; }
      button {
        margin-top: 24px;
        width: 100%;
        min-height: 48px;
        border: 0;
        border-radius: 14px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/pi/pi-sorry-color.svg" alt="" />
      <h1>You're offline</h1>
      <p>
        pi needs the internet to show your latest chats. Your messages are safe; they'll be
        here as soon as you're back online.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
